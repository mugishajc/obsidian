# obsidian default values. Each of the four sub-charts can be toggled off so
# the stack can be grown incrementally: start with metrics, then logs, then
# traces, then the collector.

metrics:
  enabled: true
logs:
  enabled: true
traces:
  enabled: true
otel:
  enabled: true

# Pass-through configuration for each sub-chart.

kube-prometheus-stack:
  grafana:
    adminPassword: changeme
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        searchNamespace: ALL
  prometheus:
    prometheusSpec:
      retention: 15d
      storageSpec:
        volumeClaimTemplate:
          spec:
            resources: { requests: { storage: 20Gi } }
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
  alertmanager:
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            resources: { requests: { storage: 2Gi } }

loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig: { replication_factor: 1 }
    storage: { type: filesystem }
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: { prefix: index_, period: 24h }
  singleBinary:
    replicas: 1
    persistence: { size: 20Gi }

tempo:
  tempo:
    retention: 72h
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: "0.0.0.0:4317" }
          http: { endpoint: "0.0.0.0:4318" }
  persistence:
    enabled: true
    size: 20Gi

opentelemetry-collector:
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib
  config:
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      batch: {}
      memory_limiter: { check_interval: 1s, limit_percentage: 75, spike_limit_percentage: 15 }
    exporters:
      otlphttp/tempo:
        endpoint: http://obsidian-tempo:4318
      prometheusremotewrite:
        endpoint: http://obsidian-kube-prometheus-stack-prometheus:9090/api/v1/write
      otlphttp/loki:
        endpoint: http://obsidian-loki:3100/otlp
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/loki]
